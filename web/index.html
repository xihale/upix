<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Upix Web — 图像超分工作台</title>
  <meta name="description" content="Upix 本地图像超分，支持 WebGPU、WASM 与 WebNN。">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@100..900&display=swap" rel="stylesheet">
  <script>
    try {
      const t = localStorage.getItem('upix.web.theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch {}
  </script>
</head>
<body>
  <a class="skip-link" href="#main">跳至主内容</a>
  <div id="app" class="app"></div>
  <noscript><p style="padding:24px;font:14px system-ui">Upix Web 需要启用 JavaScript。</p></noscript>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
