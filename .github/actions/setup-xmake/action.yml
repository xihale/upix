name: setup-xmake
description: Install pinned xmake, host C++ deps, ccache, and the per-plat package cache.

inputs:
  cache-kind:
    description: "host or android — xmake packages are plat-specific; keys must not mix"
    required: true

runs:
  using: composite
  steps:
    - name: Install host C++ deps
      shell: bash
      run: |
        case "${RUNNER_OS}" in
          Linux)
            sudo apt-get update -qq
            sudo apt-get install -y -qq libdeflate-dev g++-14 ccache
            echo "CC=gcc-14" >> "$GITHUB_ENV"
            echo "CXX=g++-14" >> "$GITHUB_ENV"
            ;;
          macOS)
            brew install libdeflate ccache
            ;;
          Windows)
            # The windows-gnu rust target links the mingw-w64 g++ runtime; the
            # ncnn island for the CLI is built with the same toolchain.
            choco install mingw ccache -y --no-progress
            echo "C:\\ProgramData\\mingw64\\mingw64\\bin" >> "$GITHUB_PATH"
            ;;
          *)
            echo "unsupported RUNNER_OS=${RUNNER_OS}" >&2
            exit 1
            ;;
        esac

    - uses: xmake-io/github-action-setup-xmake@3a1a5dddfc7fa625d9a698738334bf55655a861a  # v1 (v1.2.5)
      with:
        xmake-version: "3.1.0"

    - name: Cache xmake packages
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4 (v4.3.0)
      with:
        path: ~/.xmake/packages
        key: xmake-${{ inputs.cache-kind }}-${{ runner.os }}-${{ hashFiles('xmake.lua', 'engine/xmake.lua', 'apps/xmake.lua', 'tools/xmake.lua', 'packages/**') }}
        restore-keys: |
          xmake-${{ inputs.cache-kind }}-${{ runner.os }}-

    - name: Cache ccache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4 (v4.3.0)
      with:
        path: ~/.ccache
        key: ccache-${{ inputs.cache-kind }}-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
        restore-keys: |
          ccache-${{ inputs.cache-kind }}-${{ runner.os }}-${{ github.ref_name }}-
          ccache-${{ inputs.cache-kind }}-${{ runner.os }}-

    - name: ccache env
      shell: bash
      run: |
        # GITHUB_ENV only reaches later steps, so export here too: without it
        # `ccache -z` zeroes ccache's default dir (~/.cache/ccache) instead of
        # the one this action caches (~/.ccache).
        export CCACHE_DIR="$HOME/.ccache"
        export CCACHE_MAXSIZE=1G
        echo "CCACHE_DIR=$CCACHE_DIR" >> "$GITHUB_ENV"
        echo "CCACHE_MAXSIZE=$CCACHE_MAXSIZE" >> "$GITHUB_ENV"
        ccache -z
