name: setup-android
description: JDK 21, Gradle cache, Android SDK. NDK is opt-in — unit tests do not need it.

inputs:
  install-ndk:
    description: "true to install the NDK pinned in apps/app/build.gradle.kts"
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "21"
        cache: gradle
        cache-dependency-path: |
          apps/*.gradle.kts
          apps/gradle/libs.versions.toml
          apps/gradle/wrapper/gradle-wrapper.properties

    # Legacy `tools` 包已被 Google 从仓库下架（sdkmanager 报
    # "Failed to find package 'tools'"），显式只装 platform-tools。
    - uses: android-actions/setup-android@v3
      with:
        packages: platform-tools

    - name: Install pinned NDK
      if: inputs.install-ndk == 'true'
      shell: bash
      run: |
        ndk="$(sed -n 's/^[[:space:]]*ndkVersion[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' \
          apps/app/build.gradle.kts | head -n1)"
        [[ -n "$ndk" ]] || { echo "ndkVersion not found in apps/app/build.gradle.kts" >&2; exit 1; }
        sdkmanager --install "ndk;${ndk}"
        echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${ndk}" >> "$GITHUB_ENV"
        echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/${ndk}" >> "$GITHUB_ENV"
