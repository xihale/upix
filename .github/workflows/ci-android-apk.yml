name: CI android-apk

# Manual only. Cross-compile android-arm64-v8a debug APK; inspect separately.
on:
  workflow_dispatch:

concurrency:
  group: ci-android-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: compile (android-arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-android
        with:
          install-ndk: "true"
      - uses: ./.github/actions/setup-xmake
        with:
          cache-kind: android
      - uses: ./.github/actions/spirv-pack
      - name: assembleDebug
        working-directory: apps
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: upix-debug-apk
          path: apps/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3
      - name: ccache stats
        if: always()
        run: ccache -s || true

  test:
    name: inspect APK
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: upix-debug-apk
      - name: APK contains native lib
        run: |
          set -euo pipefail
          apk="$(find . -name 'app-debug.apk' -print -quit)"
          [[ -n "$apk" ]] || { echo "APK missing from artifact"; exit 1; }
          unzip -l "$apk" | grep -F 'lib/arm64-v8a/libupix-native.so'
          # ABI 不允许混装：包内 lib/ 下只准出现 arm64-v8a 一条。
          abis="$(unzip -Z1 "$apk" 'lib/*' | cut -d/ -f2 | sort -u)"
          [[ "$abis" == "arm64-v8a" ]] || {
            echo "ABI mixing: expected only arm64-v8a, got: $abis" >&2
            exit 1
          }
