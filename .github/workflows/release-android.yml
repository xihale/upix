name: Release Android

# Phone APK, android-arm64-v8a only. Desktop CLI is release-cli.yml.
on:
  push:
    tags: ["android-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version without prefix (e.g. 0.1.0). Ignored on tag push."
        required: true
        type: string
        default: "0.1.0"

# Least privilege: only `publish` needs write; every other job reads.
permissions:
  contents: read

concurrency:
  group: release-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  meta:
    name: version
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        env:
          # Dispatch inputs are attacker-influenced text: keep them out of the
          # script body (shell injection) and off `$GITHUB_OUTPUT` unvalidated.
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/android-v* ]]; then
            version="${GITHUB_REF_NAME#android-v}"
          else
            version="${INPUT_VERSION}"
          fi
          # The version becomes an artifact/tag name, so reject anything that
          # is not a plain version string instead of shipping from a typo.
          [[ "$version" =~ ^[0-9A-Za-z][0-9A-Za-z._-]*$ ]] || {
            echo "invalid version: '${version}' (allowed: A-Za-z0-9._-)" >&2
            exit 1
          }
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

  build:
    name: compile (android-arm64-v8a)
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4 (v4.4.0)
      - uses: ./.github/actions/setup-android
        with:
          install-ndk: "true"
      - uses: ./.github/actions/setup-xmake
        with:
          cache-kind: android
      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          [[ -n "$ANDROID_KEYSTORE_BASE64" ]] || {
            echo "ANDROID_KEYSTORE_BASE64 secret missing (Environment: release)" >&2
            exit 1
          }
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upix-release.jks"
          echo "UPIX_RELEASE_STORE_FILE=$RUNNER_TEMP/upix-release.jks" >> "$GITHUB_ENV"
      - name: assembleRelease
        env:
          UPIX_RELEASE_STORE_PASSWORD: ${{ secrets.UPIX_RELEASE_STORE_PASSWORD }}
          UPIX_RELEASE_KEY_ALIAS: ${{ secrets.UPIX_RELEASE_KEY_ALIAS }}
          UPIX_RELEASE_KEY_PASSWORD: ${{ secrets.UPIX_RELEASE_KEY_PASSWORD }}
        working-directory: apps
        run: ./gradlew assembleRelease --no-daemon
      - name: Name APK
        env:
          VER: ${{ needs.meta.outputs.version }}
        run: |
          cp apps/app/build/outputs/apk/release/app-release.apk \
            "upix-android-${VER}-arm64-v8a.apk"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4 (v4.6.2)
        with:
          name: android-apk
          path: upix-android-*-arm64-v8a.apk
          if-no-files-found: error
          retention-days: 7
      - name: ccache stats
        if: always()
        run: ccache -s || true

  smoke:
    name: smoke (android-arm64-v8a)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4 (v4.9.1)
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4 (v4.3.0)
        with:
          name: android-apk
      - name: Verify signed APK
        run: |
          set -euo pipefail
          apk="$(ls upix-android-*-arm64-v8a.apk)"
          unzip -l "$apk" | grep -F 'lib/arm64-v8a/libupix-native.so'
          # ABI 不允许混装：包内 lib/ 下只准出现 arm64-v8a 一条。
          abis="$(unzip -Z1 "$apk" 'lib/*' | cut -d/ -f2 | sort -u)"
          [[ "$abis" == "arm64-v8a" ]] || {
            echo "ABI mixing: expected only arm64-v8a, got: $abis" >&2
            exit 1
          }
          jarsigner -verify "$apk"

  publish:
    name: upload release
    needs: [meta, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write      # create/update the release + tag
      pull-requests: read  # generate_release_notes
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4 (v4.4.0)
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4 (v4.3.0)
        with:
          name: android-apk
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2 (v2.6.2)
        with:
          tag_name: android-v${{ needs.meta.outputs.version }}
          name: Upix Android ${{ needs.meta.outputs.version }}
          files: upix-android-*-arm64-v8a.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
          target_commitish: ${{ github.sha }}
