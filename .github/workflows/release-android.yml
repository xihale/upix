name: Release Android

# Phone APK, android-arm64-v8a only. Desktop CLI is release-cli.yml.
on:
  push:
    tags: ["android-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version without prefix (e.g. 0.1.0). Ignored on tag push."
        required: true
        type: string
        default: "0.1.0"

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  meta:
    name: version
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/android-v* ]]; then
            echo "version=${GITHUB_REF_NAME#android-v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: compile (android-arm64-v8a)
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-android
        with:
          install-ndk: "true"
      - uses: ./.github/actions/setup-xmake
        with:
          cache-kind: android
      - uses: ./.github/actions/spirv-pack
      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          [[ -n "$ANDROID_KEYSTORE_BASE64" ]] || {
            echo "ANDROID_KEYSTORE_BASE64 secret missing (Environment: release)" >&2
            exit 1
          }
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upix-release.jks"
          echo "UPIX_RELEASE_STORE_FILE=$RUNNER_TEMP/upix-release.jks" >> "$GITHUB_ENV"
      - name: assembleRelease
        env:
          UPIX_RELEASE_STORE_PASSWORD: ${{ secrets.UPIX_RELEASE_STORE_PASSWORD }}
          UPIX_RELEASE_KEY_ALIAS: ${{ secrets.UPIX_RELEASE_KEY_ALIAS }}
          UPIX_RELEASE_KEY_PASSWORD: ${{ secrets.UPIX_RELEASE_KEY_PASSWORD }}
        working-directory: apps
        run: ./gradlew assembleRelease --no-daemon
      - name: Name APK
        env:
          VER: ${{ needs.meta.outputs.version }}
        run: |
          cp apps/app/build/outputs/apk/release/app-release.apk \
            "upix-android-${VER}-arm64-v8a.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: upix-android-*-arm64-v8a.apk
          if-no-files-found: error
          retention-days: 7
      - name: ccache stats
        if: always()
        run: ccache -s || true

  smoke:
    name: smoke (android-arm64-v8a)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
      - name: Verify signed APK
        run: |
          set -euo pipefail
          apk="$(ls upix-android-*-arm64-v8a.apk)"
          unzip -l "$apk" | grep -F 'lib/arm64-v8a/libupix-native.so'
          jarsigner -verify "$apk"

  publish:
    name: upload release
    needs: [meta, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ needs.meta.outputs.version }}
          name: Upix Android ${{ needs.meta.outputs.version }}
          files: upix-android-*-arm64-v8a.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
          target_commitish: ${{ github.sha }}
