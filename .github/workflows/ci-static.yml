name: CI static

# Manual only. UI token greps from DESIGN_LANGUAGE.md §11.
on:
  workflow_dispatch:

concurrency:
  group: ci-static-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ui-tokens:
    name: UI token greps
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4 (v4.4.0)
      - run: scripts/check_ui_tokens.sh
