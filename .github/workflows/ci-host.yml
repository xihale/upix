name: CI host

# Manual only. Rust workspace: unit/integration tests, then the serve E2E
# suite and the model-effect oracle against the cargo-built upix-cli. One job:
# the suites consume the release binary built in the same runner.
on:
  workflow_dispatch:

concurrency:
  group: ci-host-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: build + test (linux-x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4 (v4.4.0)
      - uses: ./.github/actions/setup-xmake
        with:
          cache-kind: host
      # Static ncnn for engine-ffi (legacy/share engine sources compile in
      # place; the SPIR-V pack is tracked in legacy/share/core).
      - name: cargo test (all crates)
        run: cargo test --workspace
      - name: cargo build (release cli for the E2E suites)
        run: cargo build --release -p upix-cli
      - name: Runtime libs + python deps for the suites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libdeflate-dev libpng-dev libjpeg-dev libwebp-dev \
            libcurl4-openssl-dev libzip-dev libomp-dev \
            mesa-vulkan-drivers \
            python3-numpy python3-pil
      - name: Fetch test models (serve E2E + model oracle)
        run: target/release/upix-cli model download \
          NomosUni-SPAN-x2 HFA2k-LUDVAE-SPAN-x2 \
          Real-ESRGANv3-anime-x2 Archivist-Medium-Compact-x1 \
          NomosWebPhoto-RealPLKSR-x4 Real-ESRGAN-x2plus \
          Real-CUGAN-no-denoise-x2
      - name: Serve E2E suite (CPU)
        run: scripts/run_serve_tests.sh --device cpu
      - name: Model-effect oracle (CPU, golden images)
        run: scripts/run_model_oracle.sh --require-models
      - name: ccache stats
        if: always()
        run: ccache -s || true
