name: CI host

# Manual only. Build and test are separate jobs; the test job has no compiler.
on:
  workflow_dispatch:

concurrency:
  group: ci-host-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: compile (linux-x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4 (v4.4.0)
      - uses: ./.github/actions/setup-xmake
        with:
          cache-kind: host
      - uses: ./.github/actions/spirv-pack
      - name: Build CLI
        run: xmake cli --cc=gcc-14 --cxx=g++-14
      - name: Build host tests
        run: xmake tests --build --cc=gcc-14 --cxx=g++-14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4 (v4.6.2)
        with:
          name: host-bins
          path: |
            build/linux/x86_64/release/upix-cli
            cli/build/test_*
            desktop/build/tests/test_*
          if-no-files-found: error
          retention-days: 3
      - name: ccache stats
        if: always()
        run: ccache -s || true

  test:
    name: run tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4 (v4.4.0)
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4 (v4.3.0)
        with:
          name: host-bins
      - name: Runtime libs (no compiler)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libdeflate-dev libpng-dev libjpeg-dev libwebp-dev \
            libcurl4-openssl-dev libzip-dev libomp-dev \
            mesa-vulkan-drivers
      - name: Make binaries executable
        run: chmod +x build/linux/x86_64/release/upix-cli cli/build/test_* desktop/build/tests/test_*
      - name: Run host tests
        run: |
          set -euo pipefail
          for t in cli/build/test_* desktop/build/tests/test_*; do
            [[ -x "$t" ]] && "$t"
          done
      - name: Fetch test models (serve E2E + model oracle)
        run: build/linux/x86_64/release/upix-cli model download \
          NomosUni-SPAN-x2 HFA2k-LUDVAE-SPAN-x2 \
          Real-ESRGANv3-anime-x2 Archivist-Medium-Compact-x1 \
          NomosWebPhoto-RealPLKSR-x4 Real-ESRGAN-x2plus \
          Real-CUGAN-no-denoise-x2
      - name: Serve E2E suite (CPU)
        run: |
          sudo apt-get install -y -qq python3-numpy python3-pil
          python3 tests/serve/run.py --device cpu
      - name: Model-effect oracle (CPU, golden images)
        run: python3 tests/model_oracle/run.py --require-models
