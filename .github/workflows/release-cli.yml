name: Release CLI

# Desktop CLI for linux-x86_64 and macos-arm64. Android is a separate product
# (release-android.yml → android-arm64-v8a).
on:
  push:
    tags: ["cli-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version without prefix (e.g. 0.1.0). Ignored on tag push."
        required: true
        type: string
        default: "0.1.0"

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-cli-${{ github.ref }}
  cancel-in-progress: false

jobs:
  meta:
    name: version
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/cli-v* ]]; then
            echo "version=${GITHUB_REF_NAME#cli-v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

  spirv:
    name: spirv pack (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-xmake
        with:
          cache-kind: host
      - uses: ./.github/actions/spirv-pack
      - uses: actions/upload-artifact@v4
        with:
          name: spirv-pack
          path: share/core/spirv_pack.bin
          if-no-files-found: error
          retention-days: 3

  build:
    name: compile (${{ matrix.artifact }})
    needs: [meta, spirv]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            plat: linux
            arch: x86_64
            artifact: linux-x86_64
            extra: --cc=gcc-14 --cxx=g++-14 --native_isa=n
          - os: macos-latest
            plat: macosx
            arch: arm64
            artifact: macos-arm64
            extra: --native_isa=n
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: spirv-pack
          path: share/core
      - uses: ./.github/actions/setup-xmake
        with:
          cache-kind: host-${{ matrix.artifact }}
      - name: Build CLI
        env:
          UPIX_PLAT: ${{ matrix.plat }}
          UPIX_ARCH: ${{ matrix.arch }}
        run: scripts/build_cli.sh release ${{ matrix.extra }}
      - name: Pack
        env:
          VER: ${{ needs.meta.outputs.version }}
        run: |
          tar czf "upix-cli-${VER}-${{ matrix.artifact }}.tar.gz" \
            -C "build/${{ matrix.plat }}/${{ matrix.arch }}/release" upix-cli
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.artifact }}
          path: upix-cli-*.tar.gz
          if-no-files-found: error
          retention-days: 7
      - name: ccache stats
        if: always()
        run: ccache -s || true

  smoke:
    name: smoke (${{ matrix.artifact }})
    needs: [meta, build]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-x86_64
          - os: macos-latest
            artifact: macos-arm64
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cli-${{ matrix.artifact }}
      - name: Unpack and --version
        run: |
          tar xzf upix-cli-*.tar.gz
          chmod +x upix-cli
          if ./upix-cli --version; then
            exit 0
          fi
          # Dynamic deps if the binary is not fully static.
          case "${RUNNER_OS}" in
            Linux)
              sudo apt-get update -qq
              sudo apt-get install -y -qq \
                libdeflate-dev libpng-dev libjpeg-dev libwebp-dev \
                libcurl4-openssl-dev libzip-dev libomp-dev
              ;;
            macOS)
              brew install libdeflate libpng jpeg webp libzip libomp
              ;;
          esac
          ./upix-cli --version

  publish:
    name: upload release
    needs: [meta, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: cli-v${{ needs.meta.outputs.version }}
          name: Upix CLI ${{ needs.meta.outputs.version }}
          files: |
            upix-cli-*-linux-x86_64.tar.gz
            upix-cli-*-macos-arm64.tar.gz
          fail_on_unmatched_files: true
          generate_release_notes: true
          target_commitish: ${{ github.sha }}
