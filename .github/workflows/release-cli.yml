name: Release CLI

# Desktop CLI for linux-x86_64, macos-arm64, and macos-x86_64. Android is a
# separate product (release-android.yml → android-arm64-v8a).
on:
  push:
    tags: ["cli-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version without prefix (e.g. 0.1.0). Ignored on tag push."
        required: true
        type: string
        default: "0.1.0"

# Least privilege: only `publish` needs write; every other job reads.
permissions:
  contents: read

concurrency:
  group: release-cli-${{ github.ref }}
  cancel-in-progress: false

jobs:
  meta:
    name: version
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        env:
          # Dispatch inputs are attacker-influenced text: keep them out of the
          # script body (shell injection) and off `$GITHUB_OUTPUT` unvalidated.
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/cli-v* ]]; then
            version="${GITHUB_REF_NAME#cli-v}"
          else
            version="${INPUT_VERSION}"
          fi
          # The version becomes an artifact/tag name, so reject anything that
          # is not a plain version string instead of shipping from a typo.
          [[ "$version" =~ ^[0-9A-Za-z][0-9A-Za-z._-]*$ ]] || {
            echo "invalid version: '${version}' (allowed: A-Za-z0-9._-)" >&2
            exit 1
          }
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

  spirv:
    name: spirv pack (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4 (v4.4.0)
      - uses: ./.github/actions/setup-xmake
        with:
          cache-kind: host
      - uses: ./.github/actions/spirv-pack
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4 (v4.6.2)
        with:
          name: spirv-pack
          path: share/core/spirv_pack.bin
          if-no-files-found: error
          retention-days: 3

  build:
    name: compile (${{ matrix.artifact }})
    needs: [meta, spirv]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            plat: linux
            arch: x86_64
            artifact: linux-x86_64
            extra: --cc=gcc-14 --cxx=g++-14
          - os: macos-latest
            plat: macosx
            arch: arm64
            artifact: macos-arm64
            extra: ""
          - os: macos-15-intel
            plat: macosx
            arch: x86_64
            artifact: macos-x86_64
            extra: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4 (v4.4.0)
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4 (v4.3.0)
        with:
          name: spirv-pack
          path: share/core
      - uses: ./.github/actions/setup-xmake
        with:
          cache-kind: host-${{ matrix.artifact }}
      - name: Build CLI
        run: xmake cli -p "${{ matrix.plat }}" -a "${{ matrix.arch }}" --native-isa=n ${{ matrix.extra }}
      - name: Pack
        env:
          VER: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          # The tarball is the distributed artifact, so the AGPL-3.0 license
          # text travels with the binary (§4/§5). `-C` is applied per file
          # group: the binary comes from the build dir, LICENSE from the
          # checkout (absolute, so the second -C does not depend on the first).
          tar czf "upix-cli-${VER}-${{ matrix.artifact }}.tar.gz" \
            -C "build/${{ matrix.plat }}/${{ matrix.arch }}/release" upix-cli \
            -C "$GITHUB_WORKSPACE" LICENSE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4 (v4.6.2)
        with:
          name: cli-${{ matrix.artifact }}
          path: upix-cli-*.tar.gz
          if-no-files-found: error
          retention-days: 7
      - name: ccache stats
        if: always()
        run: ccache -s || true

  smoke:
    name: smoke (${{ matrix.artifact }})
    needs: [meta, build]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-x86_64
          - os: macos-latest
            artifact: macos-arm64
          - os: macos-15-intel
            artifact: macos-x86_64
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4 (v4.3.0)
        with:
          name: cli-${{ matrix.artifact }}
      - name: Unpack and --version
        run: |
          tar xzf upix-cli-*.tar.gz
          chmod +x upix-cli
          if ./upix-cli --version; then
            exit 0
          fi
          # Dynamic deps if the binary is not fully static.
          case "${RUNNER_OS}" in
            Linux)
              sudo apt-get update -qq
              sudo apt-get install -y -qq \
                libdeflate-dev libpng-dev libjpeg-dev libwebp-dev \
                libcurl4-openssl-dev libzip-dev libomp-dev
              ;;
            macOS)
              brew install libdeflate libpng jpeg webp libzip libomp
              ;;
          esac
          ./upix-cli --version

  publish:
    name: upload release
    needs: [meta, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write      # create/update the release + tag
      pull-requests: read  # generate_release_notes
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4 (v4.4.0)
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4 (v4.3.0)
        with:
          pattern: cli-*
          merge-multiple: true
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2 (v2.6.2)
        with:
          tag_name: cli-v${{ needs.meta.outputs.version }}
          name: Upix CLI ${{ needs.meta.outputs.version }}
          files: |
            upix-cli-*-linux-x86_64.tar.gz
            upix-cli-*-macos-arm64.tar.gz
            upix-cli-*-macos-x86_64.tar.gz
          fail_on_unmatched_files: true
          generate_release_notes: true
          target_commitish: ${{ github.sha }}
