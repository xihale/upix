name: Release CLI

on:
  push:
    tags: ["cli-v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-cli-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: compile
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-xmake
        with:
          cache-kind: host
      - uses: ./.github/actions/spirv-pack
      - name: Build (portable release)
        run: scripts/build_cli.sh release --cc=gcc-14 --cxx=g++-14 --native_isa=n
      - name: Pack
        run: |
          VER="${GITHUB_REF_NAME#cli-v}"
          tar czf "upix-cli-${VER}-linux-x86_64.tar.gz" \
            -C build/linux/x86_64/release upix-cli
      - uses: actions/upload-artifact@v4
        with:
          name: cli-tarball
          path: upix-cli-*-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 7

  smoke:
    name: run smoke
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cli-tarball
      - name: Runtime libs (no compiler)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libdeflate-dev libpng-dev libjpeg-dev libwebp-dev \
            libcurl4-openssl-dev libzip-dev libomp-dev
      - name: Unpack and --version
        run: |
          tar xzf upix-cli-*-linux-x86_64.tar.gz
          chmod +x upix-cli
          ./upix-cli --version

  publish:
    name: upload release
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cli-tarball
      - name: Create release and upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#cli-v}"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" 2>/dev/null \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
                 --title "Upix CLI ${VER}" --generate-notes --target "$GITHUB_SHA"
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            "upix-cli-${VER}-linux-x86_64.tar.gz"
