name: Release CLI

# Desktop CLI (Rust workspace: upix-cli) for linux-x86_64, macos-arm64 and
# windows-x86_64. Android is a separate product (release-android.yml →
# android-arm64-v8a).
#
# The engine island (crates/upix-engine-ffi) compiles the engine/ C++
# sources against a static ncnn; setup-xmake provides the pinned ncnn package
# island in place. The SPIR-V pack is tracked at engine/core/spirv_pack.bin, so
# no dump-spirv pass is needed. ncnn discovery in engine-ffi's build.rs
# auto-detects linux-x86_64 / macosx-arm64 / windows|mingw-x86_64 from the
# xmake package cache manifest; non-linux runners also export UPIX_NCNN_DIR
# explicitly (belt and suspenders).
on:
  push:
    tags: ["cli-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version without prefix (e.g. 0.1.0). Ignored on tag push."
        required: true
        type: string
        default: "0.1.0"

# Least privilege: only `publish` needs write; every other job reads.
permissions:
  contents: read

concurrency:
  group: release-cli-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  meta:
    name: version
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        env:
          # Dispatch inputs are attacker-influenced text: keep them out of the
          # script body (shell injection) and off `$GITHUB_OUTPUT` unvalidated.
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/cli-v* ]]; then
            version="${GITHUB_REF_NAME#cli-v}"
          else
            version="${INPUT_VERSION}"
          fi
          # The version becomes an artifact/tag name, so reject anything that
          # is not a plain version string instead of shipping from a typo.
          [[ "$version" =~ ^[0-9A-Za-z][0-9A-Za-z._-]*$ ]] || {
            echo "invalid version: '${version}' (allowed: A-Za-z0-9._-)" >&2
            exit 1
          }
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

  build:
    name: compile (${{ matrix.artifact }})
    needs: [meta]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            plat: linux
            arch: x86_64
            artifact: linux-x86_64
          - os: macos-latest
            plat: macosx
            arch: arm64
            artifact: macos-arm64
          - os: windows-latest
            plat: windows
            arch: x86_64
            artifact: windows-x86_64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4 (v4.4.0)
      - uses: ./.github/actions/setup-xmake
        with:
          cache-kind: host-${{ matrix.artifact }}
      - name: Warm the ncnn package cache for this platform (first run builds it)
        if: matrix.plat == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          # The engine island links the mingw-built static ncnn (rust target
          # is x86_64-pc-windows-gnu). `xmake require` installs the project's
          # pinned ncnn~runtime variant for the mingw plat into the cache;
          # cached runs are a no-op.
          xmake f -p mingw -a x86_64 -m release -y
          xmake require -y
      - name: Locate ncnn for engine-ffi (non-linux auto-detect)
        if: matrix.plat != 'linux'
        shell: bash
        run: |
          set -euo pipefail
          # Pick the newest cached ncnn 20260526 build matching this plat/arch
          # (mirrors discover_ncnn's manifest filter in build.rs; windows
          # accepts both 'windows' and 'mingw' manifests).
          base="$HOME/.xmake/packages/n/ncnn/20260526"
          dir=$(for d in "$base"/*/; do
            m="$d/manifest.txt"
            grep -q 'plat *= *"${{ matrix.plat }}"' "$m" && { echo "$d"; continue; }
            if [[ "${{ matrix.plat }}" == "windows" ]]; then
              grep -q 'plat *= *"mingw"' "$m" && { echo "$d"; continue; }
            fi
          done | sort | tail -1)
          test -n "$dir" && test -f "${dir}lib/libncnn.a"
          echo "UPIX_NCNN_DIR=${dir%/}" >> "$GITHUB_ENV"
      - name: Build CLI (cargo)
        run: cargo build --release -p upix-cli
      - name: Pack
        shell: bash
        env:
          VER: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          # The tarball is the distributed artifact, so the AGPL-3.0 license
          # text travels with the binary (§4/§5). `-C` is applied per file
          # group: the binary comes from the cargo target dir, LICENSE from
          # the checkout (absolute, so the second -C does not depend on the
          # first).
          if [[ "${{ matrix.plat }}" == "windows" ]]; then
            tar czf "upix-cli-${VER}-${{ matrix.artifact }}.zip" \
              -C target/release upix-cli.exe \
              -C "$GITHUB_WORKSPACE" LICENSE
          else
            tar czf "upix-cli-${VER}-${{ matrix.artifact }}.tar.gz" \
              -C target/release upix-cli \
              -C "$GITHUB_WORKSPACE" LICENSE
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4 (v4.6.2)
        with:
          name: cli-${{ matrix.artifact }}
          path: upix-cli-*.tar.gz
          if-no-files-found: error
          retention-days: 7

  smoke:
    name: smoke (${{ matrix.artifact }})
    needs: [meta, build]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-x86_64
          - os: macos-latest
            artifact: macos-arm64
          - os: windows-latest
            artifact: windows-x86_64
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4 (v4.3.0)
        with:
          name: cli-${{ matrix.artifact }}
      - name: Unpack and --version
        shell: bash
        run: |
          # Windows artifact is a zip (bsdtar handles it); unix are tarballs.
          case "${{ matrix.artifact }}" in
            windows-*) tar xf upix-cli-*.zip ;;
            *)         tar xzf upix-cli-*.tar.gz; chmod +x upix-cli ;;
          esac
          if ./upix-cli${{ matrix.artifact == 'windows-x86_64' && '.exe' || '' }} --version; then
            exit 0
          fi
          # Dynamic deps if the binary is not fully static.
          case "${RUNNER_OS}" in
            Linux)
              sudo apt-get update -qq
              sudo apt-get install -y -qq \
                libdeflate-dev libpng-dev libjpeg-dev libwebp-dev \
                libcurl4-openssl-dev libzip-dev libomp-dev
              ;;
            macOS)
              brew install libdeflate libpng jpeg webp libzip libomp
              ;;
          esac
          ./upix-cli${{ matrix.artifact == 'windows-x86_64' && '.exe' || '' }} --version

  publish:
    name: upload release
    needs: [meta, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write      # create/update the release + tag
      pull-requests: read  # generate_release_notes
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4 (v4.4.0)
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4 (v4.3.0)
        with:
          pattern: cli-*
          merge-multiple: true
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2 (v2.6.2)
        with:
          tag_name: cli-v${{ needs.meta.outputs.version }}
          name: Upix CLI ${{ needs.meta.outputs.version }}
          files: |
            upix-cli-*-linux-x86_64.tar.gz
            upix-cli-*-macos-arm64.tar.gz
            upix-cli-*-windows-x86_64.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
          target_commitish: ${{ github.sha }}
