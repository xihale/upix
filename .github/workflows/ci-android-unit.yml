name: CI android-unit

# Manual only. Compile and test are separate jobs. No NDK / xmake.
on:
  workflow_dispatch:

concurrency:
  group: ci-android-unit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compile:
    name: compile
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4 (v4.4.0)
      - uses: ./.github/actions/setup-android
        with:
          install-ndk: "false"
      - name: Compile unit-test sources
        working-directory: apps
        run: ./gradlew compileDebugUnitTestSources bundleDebugClassesToRuntimeJar -x xmakeNative --no-daemon
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4 (v4.6.2)
        with:
          name: android-unit-build
          path: apps/app/build
          if-no-files-found: error
          retention-days: 3

  test:
    name: run tests
    needs: compile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4 (v4.4.0)
      - uses: ./.github/actions/setup-android
        with:
          install-ndk: "false"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4 (v4.3.0)
        with:
          name: android-unit-build
          path: apps/app/build
      - name: Run unit tests (no compile)
        working-directory: apps
        run: |
          ./gradlew testDebugUnitTest -x xmakeNative \
            -x compileDebugUnitTestSources \
            -x compileDebugKotlin \
            -x compileDebugJavaWithJavac \
            -x compileDebugUnitTestKotlin \
            -x compileDebugUnitTestJavaWithJavac \
            -x bundleDebugClassesToRuntimeJar \
            -x bundleDebugClassesToCompileJar \
            --no-daemon
