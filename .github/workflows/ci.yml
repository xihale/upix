name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cli:
    name: CLI build + host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # libdeflate is system-only on desktop platforms (see root xmake.lua);
      # runners don't ship it. std::print (<print>) needs GCC 14+.
      - name: Install system deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libdeflate-dev g++-14

      - name: Install xmake
        run: |
          curl -fsSL https://xmake.io/shget.text | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache xmake packages
        uses: actions/cache@v4
        with:
          path: ~/.xmake/packages
          key: xmake-cli-${{ runner.os }}-${{ hashFiles('xmake.lua', 'cli/xmake.lua', 'share/xmake.lua') }}
          restore-keys: xmake-cli-${{ runner.os }}-

      - name: Build (release)
        run: scripts/build_cli.sh release --cc=gcc-14 --cxx=g++-14

      - name: Host tests
        run: |
          set -e
          for t in test_crypto test_protocol test_distributed_session test_sr_marker \
                   test_exif test_gpu_precision test_model_downloader test_image_avif; do
            echo "::group::$t"
            xmake build -y "$t"
            xmake run "$t"
            echo "::endgroup::"
          done

  android:
    name: Android unit tests + debug build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # The android before_build hook spawns an isolated HOST xmake to
      # generate share/core/spirv_pack.bin when missing — that host config
      # resolves system libdeflate too.
      - name: Install system deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libdeflate-dev

      - name: Install pinned NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;29.0.14206865" > /dev/null

      - name: Install xmake
        run: |
          curl -fsSL https://xmake.io/shget.text | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache xmake packages (android cross build)
        uses: actions/cache@v4
        with:
          path: ~/.xmake/packages
          key: xmake-android-${{ runner.os }}-${{ hashFiles('xmake.lua', 'share/xmake.lua') }}
          restore-keys: xmake-android-${{ runner.os }}-

      # Generate share/core/spirv_pack.bin up front (isolated host config, same
      # as the before_build hook would). Without it the hook spawns a host xmake
      # mid-gradle whose package-install confirmation cannot succeed headless.
      - name: Generate spirv pack (host)
        run: |
          mkdir -p build/host-dump-config
          export XMAKE_CONFIGDIR="$PWD/build/host-dump-config"
          xmake f -p linux -a x86_64 -m release --cc=gcc-14 --cxx=g++-14 --yes
          xmake -y dump-spirv
          ./build/linux/x86_64/release/dump-spirv share/core/spirv_pack.bin
          ls -la share/core/spirv_pack.bin

      # Offline phases of the standard verification script: unit tests + debug
      # APK (which runs the xmakeNative cross build). Device smoke needs a
      # device and is skipped.
      - name: Unit tests + assembleDebug
        run: apps/scripts/android_test.sh --skip-device

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: upix-debug-apk
          path: apps/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
