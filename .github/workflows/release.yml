name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  cli-linux:
    name: CLI linux-x86_64 → GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # libdeflate is system-only on desktop platforms (see root xmake.lua);
      # runners don't ship it. std::print (<print>) needs GCC 14+.
      - name: Install system deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libdeflate-dev g++-14

      - name: Install xmake
        run: |
          curl -fsSL https://xmake.io/shget.text | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache xmake packages
        uses: actions/cache@v4
        with:
          path: ~/.xmake/packages
          key: release-cli-${{ runner.os }}-${{ hashFiles('xmake.lua', 'cli/xmake.lua', 'share/xmake.lua') }}
          restore-keys: release-cli-${{ runner.os }}-

      - name: Build (release)
        run: scripts/build_cli.sh release --cc=gcc-14 --cxx=g++-14

      - name: Pack
        run: |
          TAG="${{ github.ref_name }}"
          tar czf "upix-cli-${TAG}-linux-x86_64.tar.gz" \
            -C build/linux/x86_64/release upix-cli

      - name: Create release and upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" 2>/dev/null \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
                 --title "Upix $TAG" --generate-notes --verify-tag
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            upix-cli-"$TAG"-linux-x86_64.tar.gz
