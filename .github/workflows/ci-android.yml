name: CI Android

on:
  push:
    branches: [main]
  pull_request:

jobs:
  android:
    name: Android unit tests + debug build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # The spirv-pack bootstrap below configures a HOST xmake (isolated
      # configdir), which resolves system libdeflate and GCC 14 (<print>).
      # dump-spirv's ncnn init calls vkCreateInstance (glslang init lives
      # there); the pack itself is compiled for canonical frozen profiles
      # (skip_device_defines), so a software ICD (lavapipe) satisfies it and
      # the output stays byte-identical to GPU-machine builds.
      - name: Install system deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libdeflate-dev g++-14 mesa-vulkan-drivers

      - name: Install pinned NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;29.0.14206865" > /dev/null

      - name: Install xmake
        run: |
          curl -fsSL https://xmake.io/shget.text | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache xmake packages (android cross build)
        uses: actions/cache@v4
        with:
          path: ~/.xmake/packages
          key: xmake-android-${{ runner.os }}-${{ hashFiles('xmake.lua', 'share/xmake.lua', 'apps/xmake.lua', 'packages/**') }}
          restore-keys: xmake-android-${{ runner.os }}-

      # Generate share/core/spirv_pack.bin up front (isolated host config, the
      # same fallback the share before_build hook would use). Doing it here
      # keeps gradle/xmakeNative free of a nested host build, and dump-spirv
      # is self-contained (static libomp) so direct exec needs no runenv.
      - name: Generate spirv pack (host)
        run: |
          mkdir -p build/host-dump-config
          export XMAKE_CONFIGDIR="$PWD/build/host-dump-config"
          xmake f -p linux -a x86_64 -m release --cc=gcc-14 --cxx=g++-14 --yes
          xmake -y dump-spirv
          ./build/linux/x86_64/release/dump-spirv share/core/spirv_pack.bin
          ls -la share/core/spirv_pack.bin

      # Offline phases of the standard verification script: unit tests + debug
      # APK (which runs the xmakeNative cross build). Device smoke needs a
      # device and is skipped.
      - name: Unit tests + assembleDebug
        run: apps/scripts/android_test.sh --skip-device

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: upix-debug-apk
          path: apps/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
