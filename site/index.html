<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f3f4f5" />
    <meta name="description" content="Upix 图像超分辨率。亲手拖动，重新看见画面的细节。在你的手机与电脑上运行。" />
    <meta property="og:title" content="Upix · 看见，更多。" />
    <meta property="og:description" content="图像超分辨率，亲手看见细节。" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="images/restored.webp" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='4' fill='%233151d4'/%3E%3Ctext x='32' y='46' text-anchor='middle' fill='%23f3f4f5' font-family='sans-serif' font-size='48'%3Eu%3C/text%3E%3C/svg%3E" />
    <link rel="preload" href="/fonts/noto-sc-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/images/restored.webp" as="image" fetchpriority="high" />
    <link rel="stylesheet" href="/src/style.css" />
    <title>Upix · 看见，更多。</title>
  </head>
  <body id="top">
    <a class="skip-link" href="#artwork">跳至图像对比</a>
    <header class="site-header page-width">
      <a class="wordmark" href="#top" aria-label="Upix 首页">upix</a>
      <nav aria-label="主要导航">
        <a class="quiet-link" href="https://github.com/xihale/upix" target="_blank" rel="noopener noreferrer">GitHub</a>
        <a class="primary-link" href="#get">获取 Upix</a>
      </nav>
    </header>

    <main>
      <section class="hero page-width" aria-labelledby="hero-title">
        <div class="hero-heading">
          <div>
            <h1 id="hero-title">看见，更多。</h1>
            <p class="hero-description">图像超分辨率</p>
          </div>
          <button class="text-button zoom-button" type="button" aria-pressed="false" aria-controls="artwork" disabled>放大细节<span aria-hidden="true">＋</span></button>
        </div>

        <figure class="artwork-figure">
          <div id="artwork" class="artwork" data-status="loading" aria-busy="true">
            <div class="image-plane restored-plane"><img id="restored" src="/images/restored.webp" alt="修复后的插画，眼睛、发丝和笔触的细节清晰可见" width="2560" height="1708" fetchpriority="high" draggable="false" /></div>
            <div class="image-plane source-plane"><img id="source" src="/images/source.webp" alt="同一幅插画的低分辨率原图" width="640" height="427" draggable="false" /></div>
            <div class="divider" aria-hidden="true"><span class="divider-grip">‹<i></i>›</span></div>
            <input class="comparison-input" type="range" min="0" max="100" step="1" value="50" aria-label="原图与修复图分界位置" aria-valuetext="原图 50%，修复图 50%" disabled />
            <div class="image-status" role="status"><span class="status-message">正在载入图片</span><button class="retry-button" type="button" hidden>重试</button></div>
          </div>
          <figcaption class="artwork-caption">
            <span>原图 <span class="dimensions">640 × 427</span></span>
            <a class="artwork-credit" href="https://re.bluepoch.com/home/detail.html#wallpaper" target="_blank" rel="noopener noreferrer" aria-label="图片来源：1999（重返未来：1999 官网壁纸）">1999</a>
            <span>Upix <span class="scale">4×</span></span>
          </figcaption>
        </figure>
      </section>

      <section id="get" class="get-section page-width" aria-labelledby="get-title">
        <h2 id="get-title">你的设备</h2>
        <p>手机与电脑，局域网协作。</p>
        <div class="platform-links">
          <a href="https://github.com/xihale/upix/releases/tag/android-v0.1.1" target="_blank" rel="noopener noreferrer"><span>Android</span><span>下载</span></a>
          <a href="https://github.com/xihale/upix/releases/tag/cli-v0.1.0" target="_blank" rel="noopener noreferrer"><span>CLI</span><span>下载</span></a>
        </div>
      </section>
    </main>

    <footer class="page-width site-footer"><a class="wordmark footer-wordmark" href="#top" aria-label="Upix 返回顶部">upix</a><a href="https://github.com/xihale/upix/blob/main/LICENSE" target="_blank" rel="noopener noreferrer">开源</a></footer>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
